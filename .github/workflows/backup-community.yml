name: Backup community submissions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cloud shards into community.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const BASE = 'https://mantledb.sh/v2/juben-tiepi-public-v1/';
            const SHARD_COUNT = 10;
            const urls = [BASE + 'community'];
            for (let i = 0; i < SHARD_COUNT; i++) urls.push(BASE + 'c' + i);

            function roleKey(book, name) {
              const n = (s) => String(s || '').trim().replace(/^《|》$/g, '').replace(/\s+/g, '').toLowerCase();
              return n(book) + '|' + n(name);
            }
            function merge(a, b) {
              const map = new Map();
              [...a, ...b].forEach((s) => {
                if (!s || !s.book || !s.name || !Array.isArray(s.v) || s.v.length !== 12) return;
                const k = roleKey(s.book, s.name) + '::' + (s.visitorId || s.user || '');
                const prev = map.get(k);
                if (!prev || String(s.at || '') > String(prev.at || '')) map.set(k, s);
              });
              return [...map.values()].sort((x, y) => String(y.at || '').localeCompare(String(x.at || '')));
            }

            async function getJson(url) {
              const res = await fetch(url + '?t=' + Date.now(), {
                headers: {
                  Accept: 'application/json',
                  'User-Agent': 'juben-tiepi-backup/1.0',
                },
              });
              if (!res.ok) return null;
              try { return await res.json(); } catch (e) { return null; }
            }

            let submissions = [];
            for (const url of urls) {
              const data = await getJson(url);
              if (data && Array.isArray(data.submissions)) {
                submissions = merge(submissions, data.submissions);
              }
            }

            const out = {
              version: 2,
              updatedAt: new Date().toISOString(),
              source: 'mantledb-shards',
              count: submissions.length,
              submissions,
              pool: [],
            };
            fs.writeFileSync('community.json', JSON.stringify(out, null, 2) + '\n');
            fs.mkdirSync('backups', { recursive: true });
            fs.writeFileSync('backups/community-latest.json', JSON.stringify(out, null, 2) + '\n');
            const day = new Date().toISOString().slice(0, 10);
            fs.writeFileSync('backups/community-' + day + '.json', JSON.stringify(out, null, 2) + '\n');
            console.log('backed up', submissions.length, 'submissions');

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community.json backups/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: backup community submissions"
            git push
          fi
